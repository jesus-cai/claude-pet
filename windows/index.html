<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' blob: data:">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
  #pet { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); cursor: grab; }
  #pet.dragging { cursor: grabbing; }
  #bubble {
    position: absolute; left: 50%; max-width: 300px; box-sizing: border-box;
    transform: translateX(-50%) scale(0.6); opacity: 0; transform-origin: 50% 100%;
    transition: opacity .18s ease, transform .22s cubic-bezier(.2, 1.4, .4, 1);
    font: 600 13px/1.3 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    color: #f2f2f2; background: rgba(28, 28, 32, .92); border-radius: 12px;
    padding: 7px 11px 7px 22px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    box-shadow: 0 2px 10px rgba(0,0,0,.25); pointer-events: none;
  }
  #bubble.show { opacity: 1; transform: translateX(-50%) scale(1); }
  #bubble::after {   /* el piquito */
    content: ""; position: absolute; left: 50%; bottom: -6px; margin-left: -6px;
    border: 6px solid transparent; border-bottom: 0; border-top-color: rgba(28, 28, 32, .92);
  }
  #bubble .dot { position: absolute; left: 10px; top: 50%; width: 7px; height: 7px; margin-top: -3.5px; border-radius: 50%; }
  #bubble .tag, #bubble .lead { color: #a8a8b0; font-weight: 500; }
  #bubble .dots span { animation: blink 1.2s infinite; }
  #bubble .dots span:nth-child(2) { animation-delay: .2s; } #bubble .dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 60%, 100% { opacity: .25 } 30% { opacity: 1 } }
  .working .dot { background: #8a8a92; } .waiting .dot { background: #ff9f0a; }
  .done .dot { background: #30d158; } .error .dot { background: #ff453a; }
  .waiting, .error { box-shadow: 0 0 0 1.5px currentColor inset; }
  .waiting { color: #ffd9a8; } .error { color: #ffc4c0; }
</style>
</head>
<body>
  <div id="bubble"></div>
  <canvas id="pet"></canvas>
  <script src="renderer.js"></script>
</body>
</html>
